---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
lint: |
  set -e
  yamllint -d "{extends: default, rules: {line-length: {max: 120, level: warning}}, ignore: .github/workflows/molecule.yml}" .
  ansible-lint
platforms:
  - name: "dovecot-${image:-docker-rockylinux9-ansible}"
    image: "${namespace:-geerlingguy}/${image:-docker-rockylinux9-ansible}:${tag:-latest}"
    platform: "linux/amd64"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tty: true
provisioner:
  name: ansible
  inventory:
    host_vars:
      dovecot-docker-rockylinux9-ansible:
        ansible_become_method: su
      dovecot-docker-rockylinux10-ansible:
        ansible_become_method: su
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
  lint:
    name: ansible-lint
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: ansible
